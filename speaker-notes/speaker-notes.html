<title>On-Ramp Speaker Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Presenter console: one dark working surface. Notes column left, slide rail right. Single deliberate dark look. */
:root{
  color-scheme:dark;
  --bg:#0E2A19; --panel:#123321; --panel2:#17402A; --line:rgba(244,245,240,.14);
  --fg:#F4F5F0; --muted:#9FB0A4; --tan:#C9A86F; --sage:#8DB27A; --warn:#E5484D;
  --x:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"Martian Mono",ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--x);margin:0}
button,select,textarea{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,.rail button:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.brand b{color:var(--fg)}
.clock{display:flex;align-items:center;gap:8px;font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.clock small{font:400 11px var(--mono);color:var(--muted);letter-spacing:.04em}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font:500 12px var(--mono);letter-spacing:.04em;cursor:pointer}
.pill:hover{background:var(--panel2)}
.pill[aria-pressed="true"]{background:var(--tan);color:var(--bg);border-color:var(--tan)}
select.pill{appearance:none;padding-right:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;min-height:0;padding-top:18px}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px}
.num{font:600 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-family:var(--x);font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(28px,4vw,46px);letter-spacing:-.02em;line-height:.95;text-wrap:balance;margin:0}
.who{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px 5px 6px;font:600 12px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.chip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--bg)}
.target{font:400 12px var(--mono);color:var(--muted)}
.body{flex:1;min-height:0;overflow:auto;margin-top:18px;padding-right:6px}
.body p{font-size:clamp(20px,2.2vw,27px);line-height:1.5;margin:0 0 .8em;max-width:62ch}
.body p .click{font:600 .62em var(--mono);color:var(--tan);border:1px solid rgba(201,168,111,.45);border-radius:6px;padding:1px 6px;vertical-align:.15em;letter-spacing:.04em}
.body .empty{color:var(--muted);font-family:var(--serif);font-size:26px}
textarea{width:100%;min-height:52vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:20px;line-height:1.5;resize:vertical}
.editbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.status{font:400 12px var(--mono);color:var(--muted)}
.status.err{color:var(--warn)}
.next{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font:400 12px var(--mono);color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.next b{color:var(--fg);font-weight:600}
.nav{display:flex;gap:8px;margin-left:auto}
.nav button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 20px;font:600 15px var(--x);cursor:pointer;min-width:110px}
.nav button:hover{background:var(--panel2)}
.rail{min-height:0;overflow:auto;border-left:1px solid var(--line);padding-left:16px}
.rail h2{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rail button{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:10px;padding:8px 8px;cursor:pointer}
.rail button:hover{background:var(--panel)}
.rail button[aria-current="true"]{background:var(--panel2)}
.rail .n{font:400 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rail .l{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .s{font:600 10px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.rail li.dim{opacity:.35}
.totals{font:400 11px var(--mono);color:var(--muted);margin-top:14px;line-height:1.7}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);margin-top:14px}
@media (max-width:760px){
  .main{grid-template-columns:1fr}
  .rail{border-left:0;border-top:1px solid var(--line);padding:14px 0 0;max-height:40vh}
  .nav{width:100%}.nav button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <p class="brand"><b>Building the On-Ramp</b> · speaker notes</p>
    <label class="clock"><span id="clock">00:00</span><small id="pace">of ~15:00</small></label>
    <button class="pill" id="timerBtn" aria-pressed="false">Start timer</button>
    <button class="pill" id="resetBtn">Reset</button>
    <select class="pill" id="filter" aria-label="Highlight a speaker">
      <option value="">Everyone</option><option>John</option><option>Callen</option><option>Wiley</option><option>Josh</option>
    </select>
  </header>

  <div class="main">
    <section class="stage" aria-live="polite">
      <div class="meta"><span class="num" id="num">Loading notes</span></div>
      <h1 class="title" id="title">Speaker notes</h1>
      <div class="who" id="who"></div>
      <div class="body" id="body"><p class="empty">Notes load from the shared store. If this stays empty, sign in to claude.ai with an account this page is shared with.</p></div>
      <div class="next">
        <span>Up next: <b id="nextLbl">…</b></span>
        <div class="nav"><button id="prevBtn">← Back</button><button id="nextBtn">Next →</button></div>
      </div>
    </section>
    <aside class="rail">
      <h2>All slides</h2>
      <ol id="list"></ol>
      <p class="totals" id="totals"></p>
    </aside>
  </div>
</div>

<script>
(function(){
  const COLORS={John:'#C9A86F',Callen:'#8DB27A',Wiley:'#7FA7C9',Josh:'#E0B3A0'};
  const SPEAKERS=['John','Callen','Wiley','Josh'];
  const $=id=>document.getElementById(id);
  let notes=[], i=0, editing=false, canWrite=null, db=null, saving=false;
  let filter='';
  try{filter=localStorage.getItem('ngf-notes-filter')||''}catch(e){}
  $('filter').value=filter;
  try{const h=parseInt(location.hash.slice(1),10);if(h>0)i=h-1}catch(e){}

  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const secs=t=>{const m=String(t||'0:00').split(':');return (+m[0]||0)*60+(+m[1]||0)};
  const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');

  function chip(name){
    const c=COLORS[name]||'#9FB0A4';
    return '<span class="chip" style="background:'+c+'22;color:'+c+'"><i style="background:'+c+'">'+esc((name||'?')[0])+'</i>'+esc(name||'Unassigned')+'</span>';
  }
  function paras(text){
    return String(text||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
      .map(p=>'<p>'+esc(p).replace(/\(click\)/g,'<span class="click">CLICK</span>')+'</p>').join('');
  }

  function render(){
    if(!notes.length){renderList();return}
    i=Math.max(0,Math.min(notes.length-1,i));
    const n=notes[i];
    $('num').textContent=String(i+1).padStart(2,'0')+' / '+notes.length;
    $('title').textContent=n.label||'Slide '+(i+1);
    let who=chip(n.speaker)+'<span class="target">aim for '+esc(n.time||'?')+'</span>';
    if(canWrite!==false){
      who+='<select class="pill" id="spk" aria-label="Change speaker">'+SPEAKERS.map(s=>'<option'+(s===n.speaker?' selected':'')+'>'+s+'</option>').join('')+'</select>';
      who+='<button class="pill" id="editBtn">'+(editing?'Cancel':'Edit notes')+'</button>';
    }
    $('who').innerHTML=who;
    if(editing){
      $('body').innerHTML='<textarea id="ta" aria-label="Notes for this slide"></textarea><div class="editbar"><button class="pill" id="saveBtn" aria-pressed="true">Save</button><span class="status" id="st">Blank line = new paragraph. Type (click) to mark a click. Ctrl/Cmd + Enter saves.</span></div>';
      const ta=$('ta');ta.value=n.text||'';ta.focus();
      ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();save()}if(e.key==='Escape'){editing=false;render()}});
      $('saveBtn').onclick=save;
    }else{
      $('body').innerHTML=paras(n.text)||'<p class="empty">No notes for this slide yet.</p>';
      $('body').scrollTop=0;
    }
    const eb=$('editBtn');if(eb)eb.onclick=()=>{editing=!editing;render()};
    const sp=$('spk');if(sp)sp.onchange=()=>write({speaker:sp.value});
    const nx=notes[i+1];
    $('nextLbl').textContent=nx?(nx.label+' · '+(nx.speaker||'')):'End of deck';
    try{history.replaceState(null,'','#'+(i+1))}catch(e){}
    renderList();
  }
  function renderList(){
    $('list').innerHTML=notes.map((n,k)=>'<li class="'+(filter&&n.speaker!==filter?'dim':'')+'"><button data-k="'+k+'" aria-current="'+(k===i)+'"><span class="n">'+String(k+1).padStart(2,'0')+'</span><span class="l">'+esc(n.label||'')+'</span><span class="s" style="color:'+(COLORS[n.speaker]||'#9FB0A4')+'">'+esc(n.speaker||'')+'</span></button></li>').join('');
    const tot={};let all=0;notes.forEach(n=>{const t=secs(n.time);all+=t;tot[n.speaker]=(tot[n.speaker]||0)+t});
    $('totals').innerHTML='Total ~'+fmt(all)+'<br>'+SPEAKERS.map(s=>esc(s)+' ~'+fmt(tot[s]||0)).join(' · ');
    $('pace').textContent='of ~'+fmt(all);
  }
  $('list').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;editing=false;i=+b.dataset.k;render()});

  async function write(patch){
    if(!db||saving)return false;
    const n=notes[i];saving=true;
    const st=$('st');if(st){st.className='status';st.textContent='Saving…'}
    try{
      await db.collection('notes').doc(n.id).update(patch);
      saving=false;return true;
    }catch(e){
      saving=false;
      if(e&&e.code==='invalid_argument'){canWrite=false;render()}
      const s2=$('st');if(s2){s2.className='status err';s2.textContent='Could not save. You may need edit access to this page; ask the owner to share it with you as an editor.'}
      return false;
    }
  }
  async function save(){
    const ta=$('ta');if(!ta)return;
    const text=ta.value.replace(/\r/g,'').trim();
    if(text===(notes[i].text||'')){editing=false;render();return}
    if(await write({text})){editing=false;render()}
  }

  function go(d){if(editing)return;i+=d;render()}
  $('prevBtn').onclick=()=>go(-1);
  $('nextBtn').onclick=()=>go(1);
  addEventListener('keydown',e=>{
    if(editing||/^(TEXTAREA|SELECT|INPUT)$/.test(document.activeElement&&document.activeElement.tagName))return;
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}
  });
  $('filter').onchange=()=>{filter=$('filter').value;try{localStorage.setItem('ngf-notes-filter',filter)}catch(e){}renderList()};

  // stopwatch (local to this laptop)
  let t0=null,acc=0,tick=null;
  const show=()=>{const s=Math.floor((acc+(t0?Date.now()-t0:0))/1000);$('clock').textContent=fmt(s)};
  $('timerBtn').onclick=()=>{
    const b=$('timerBtn');
    if(t0){acc+=Date.now()-t0;t0=null;clearInterval(tick);b.textContent='Resume timer';b.setAttribute('aria-pressed','false')}
    else{t0=Date.now();tick=setInterval(show,500);b.textContent='Pause timer';b.setAttribute('aria-pressed','true')}
    show();
  };
  $('resetBtn').onclick=()=>{acc=0;if(t0)t0=Date.now();show()};

  // shared store
  (async()=>{
    const use=window.claude&&window.claude.use;
    db=use?await window.claude.use('db'):null;
    if(!db){
      $('num').textContent='Notes unavailable';
      $('body').innerHTML='<p class="empty">This view can’t reach the shared notes. Open the page on claude.ai while signed in to an account it’s shared with.</p>';
      return;
    }
    try{const user=await window.claude.use('user');canWrite=user?await user.can('data.write'):null}catch(e){canWrite=null}
    db.collection('notes').orderBy('n').onSnapshot(snap=>{
      notes=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(!notes.length){
        $('num').textContent='No notes yet';
        $('title').textContent='Speaker notes';
        $('body').innerHTML='<p class="empty">The notes haven’t been loaded into this page yet. Once they are, each slide’s script appears here and anyone with edit access can change it.</p>';
        renderList();return;
      }
      if(editing)return renderList();
      render();
    },err=>{
      $('num').textContent='Connection lost';
      $('body').insertAdjacentHTML('beforeend','<p class="banner">Live updates stopped. Reload the page to reconnect.</p>');
    });
  })();
})();
</script>
